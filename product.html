<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOPNEX Product</title><link rel="stylesheet" href="style.css"></head><body><main id="p" style="max-width:1100px;margin:30px auto;padding:20px"></main><script>
const ps=JSON.parse(localStorage.getItem("shopnexProducts")||"[]"),id=new URLSearchParams(location.search).get("id"),p=ps.find(x=>String(x.id)===String(id)),e=document.getElementById("p");
if(!p)e.innerHTML="<h2>Product not found</h2>";else{let ims=p.images&&p.images.length?p.images:[p.image],price=p.sale&&p.sale<p.price?p.sale:p.price;e.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:30px"><div><img id="hero" src="${ims[0]}" style="width:100%;max-height:600px;object-fit:contain"><div style="display:flex;gap:8px;margin-top:10px">${ims.map(x=>`<img src="${x}" onclick="hero.src=this.src" style="width:70px;height:70px;object-fit:cover;cursor:pointer">`).join("")}</div></div><div><p>${p.category||""}</p><h1>${p.name}</h1><h2>PKR ${Number(price).toLocaleString()}</h2><p>${p.desc||""}</p><p>Stock: ${p.stock}</p><button onclick="let c=JSON.parse(localStorage.getItem('shopnexCart')||'[]'),x=c.find(y=>y.id==='${p.id}');if(x)x.qty++;else c.push({...p,qty:1});localStorage.setItem('shopnexCart',JSON.stringify(c));alert('Added to cart')" style="padding:13px 22px;background:#171717;color:white;border:0;border-radius:8px">Add to cart</button></div></div>`}
</script></body></html>
